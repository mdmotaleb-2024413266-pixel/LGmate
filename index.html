<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LGmate — AI English Tutor</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root { --blue: #4cc9f0; --purple: #9b5de5; --dark: #050816; }
    body {
      min-height: 100vh; background: var(--dark); color: #eaeaff;
      font-family: 'Inter', sans-serif; display: flex; flex-direction: column;
      align-items: center; justify-content: center; margin: 0; padding: 20px;
    }
    h1 { font-family: 'Orbitron'; color: var(--blue); letter-spacing: 8px; margin-bottom: 10px; }
    
    .orb {
      width: 160px; height: 160px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, var(--blue), var(--purple));
      box-shadow: 0 0 40px rgba(76,201,240,0.3); transition: 0.5s; margin: 20px 0;
    }
    .listening { animation: pulse 1.2s infinite alternate; box-shadow: 0 0 60px var(--blue); }
    .speaking { animation: wave 1s infinite ease-in-out; box-shadow: 0 0 60px var(--purple); }
    
    @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }
    @keyframes wave { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05) translateY(-5px); } }

    .transcript { font-size: 18px; text-align: center; max-width: 600px; min-height: 50px; color: #ccc; margin: 15px 0; line-height: 1.5; }
    
    .controls { background: rgba(255,255,255,0.05); padding: 25px; border-radius: 20px; text-align: center; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    .label-text { font-size: 12px; color: var(--blue); margin-bottom: 10px; display: block; font-family: 'Orbitron'; }
    
    select {
      background: #120a2a; color: white; border: 1px solid var(--blue);
      padding: 12px; border-radius: 10px; width: 300px; cursor: pointer; margin-bottom: 20px; outline: none;
    }
    
    .start-btn {
      padding: 15px 50px; border-radius: 40px; border: none;
      background: linear-gradient(135deg, var(--blue), var(--purple));
      color: #000; font-weight: 800; font-family: 'Orbitron'; cursor: pointer; transition: 0.3s;
    }
    .start-btn:hover { transform: scale(1.05); box-shadow: 0 0 25px var(--blue); }
    .hidden { display: none !important; }

    .dev-section { margin-top: 50px; text-align: center; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px; width: 100%; max-width: 500px; }
    .dev-name { font-family: 'Orbitron'; color: var(--blue); font-size: 14px; margin-bottom: 5px; }
    .dev-bio { font-size: 12px; color: #888; line-height: 1.6; margin-bottom: 10px; }
    .fb-link { color: var(--purple); text-decoration: none; font-weight: bold; border: 1px solid var(--purple); padding: 5px 15px; border-radius: 20px; transition: 0.3s; }
    .fb-link:hover { background: var(--purple); color: #fff; }
  </style>
</head>
<body>

  <h1>LGMATE</h1>
  <div class="orb" id="orb"></div>
  <div class="transcript" id="transcript">Ready to assist your English journey.</div>

  <div class="controls" id="controls">
    <span class="label-text">Select Input Device</span>
    <select id="micSelect">
      <option value="">Detecting Microphones...</option>
    </select>
    <br>
    <button class="start-btn" id="startBtn">INITIALIZE</button>
  </div>

  <div class="dev-section">
    <div class="dev-name">Developed by Mohammad Miraz Ali</div>
    <div class="dev-bio">
      EEE, University of Dhaka<br>
      Expertise in AI, Robotics & Electronic Systems
    </div>
    <a href="https://www.facebook.com/mohammad.miraz.ali.2025" target="_blank" class="fb-link">Connect with Miraz</a>
  </div>

  <script>
    const orb = document.getElementById('orb');
    const transcript = document.getElementById('transcript');
    const startBtn = document.getElementById('startBtn');
    const micSelect = document.getElementById('micSelect');
    const controls = document.getElementById('controls');

    // রেন্ডার ব্যাকএন্ড ইউআরএল (আপনার স্ক্রিনশট অনুযায়ী সেট করা হয়েছে)
    const BACKEND_URL = 'https://lgmate.onrender.com/chat';

    async function initDevices() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const devices = await navigator.mediaDevices.enumerateDevices();
        const mics = devices.filter(d => d.kind === 'audioinput');
        
        micSelect.innerHTML = mics.map((m, i) => 
          `<option value="${m.deviceId}">${m.label || 'Microphone ' + (i+1)}</option>`
        ).join('');
        
        stream.getTracks().forEach(track => track.stop());
      } catch (err) {
        transcript.innerText = "Error: Mic Access Denied. Check browser settings.";
      }
    }

    window.onload = initDevices;

    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = 'en-US';
    recognition.continuous = false;
    recognition.interimResults = false;

    let isBusy = false;

    async function processAI(text) {
      isBusy = true;
      orb.className = "orb";
      try {
        // এখানে আপনার রেন্ডার লিঙ্কটি ব্যবহার করা হয়েছে
        const response = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: text })
        });
        const data = await response.json();
        transcript.innerText = data.reply;
        playResponse(data.audio);
      } catch (err) {
        transcript.innerText = "Error: Cannot connect to Render Backend. Wait 1 min for server start.";
        console.error(err);
        isBusy = false;
      }
    }

    function playResponse(base64) {
      const audio = new Audio("data:audio/mpeg;base64," + base64);
      orb.className = "orb speaking";
      audio.play();
      audio.onended = () => {
        orb.className = "orb listening";
        isBusy = false;
        setTimeout(() => { if(!isBusy) recognition.start(); }, 300);
      };
    }

    recognition.onresult = (event) => {
      const text = event.results[0][0].transcript;
      transcript.innerText = `You: "${text}"`;
      processAI(text);
    };

    recognition.onend = () => {
      if (!isBusy) {
        try { recognition.start(); } catch(e) {}
      }
    };

    startBtn.onclick = () => {
      controls.classList.add('hidden');
      orb.className = "orb listening";
      recognition.start();
    };
  </script>
</body>
</html>
