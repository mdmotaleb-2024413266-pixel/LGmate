<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#050816">
    <title>LAGmate — Elevate Your Fluency</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root { 
            --blue: #4cc9f0; 
            --purple: #9b5de5; 
            --dark: #02040a; 
            --glass: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8f9ff;
            --text-dim: #a5a9ff;
            --accent-gradient: linear-gradient(135deg, #4cc9f0 0%, #9b5de5 100%);
        }

        /* --- GLOBAL RESET --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            min-height: 100vh;
            background: var(--dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(76, 201, 240, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(155, 93, 229, 0.12) 0%, transparent 40%);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        /* --- BRANDING --- */
        .brand-header {
            text-align: center;
            margin-top: 45px;
            animation: fadeInDown 1s ease-out;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-family: 'Orbitron';
            letter-spacing: 12px;
            margin: 0;
            font-size: clamp(32px, 8vw, 52px);
            font-weight: 900;
            filter: drop-shadow(0 0 20px rgba(76, 201, 240, 0.3));
        }

        .brand-lag { color: var(--blue); }
        .brand-mate { color: var(--purple); text-transform: lowercase; letter-spacing: 6px; }

        .hero-subtitle {
            font-size: 16px;
            color: #7d8191; 
            margin-top: 15px;
            font-weight: 400;
            letter-spacing: 1.5px;
            display: inline-block;
            position: relative;
            padding-bottom: 8px;
        }

        .hero-subtitle::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 2px;
            background: var(--accent-gradient);
            border-radius: 2px;
        }

        /* --- ORB DESIGN --- */
        .orb-wrapper {
            position: relative;
            margin: 50px 0;
            perspective: 1000px;
        }

        .orb {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fff 0%, var(--blue) 20%, var(--purple) 60%, var(--dark) 100%);
            box-shadow: 0 0 60px rgba(76, 201, 240, 0.2), inset 0 0 40px rgba(0,0,0,0.5);
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .orb::after {
            content: '';
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.05);
            animation: rotate-ring 10s linear infinite;
        }

        @keyframes rotate-ring { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .listening { animation: breathe 2s infinite ease-in-out; box-shadow: 0 0 80px rgba(76, 201, 240, 0.5); }
        .speaking { animation: dynamic-wave 0.6s infinite alternate; box-shadow: 0 0 80px rgba(155, 93, 229, 0.5); }
        .thinking { filter: hue-rotate(90deg) brightness(1.2); transform: scale(0.9) rotateY(180deg); }

        @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        @keyframes dynamic-wave { from { transform: scale(1) translateY(0); } to { transform: scale(1.05) translateY(-8px); } }

        /* --- TRANSCRIPT SECTION --- */
        .transcript-container {
            width: 100%;
            max-width: 550px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 35px;
            margin-bottom: 30px;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(255,255,255,0.04);
            padding: 8px 20px;
            border-radius: 100px;
            border: 1px solid var(--glass-border);
            margin-bottom: 25px;
            align-self: center;
        }

        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--blue); position: relative; }
        .dot::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; background: inherit; opacity: 0.4; animation: ping 1.5s infinite; }

        @keyframes ping { 75%, 100% { transform: scale(2.5); opacity: 0; } }

        .line { font-size: 17px; line-height: 1.8; font-weight: 400; }
        .user-line { color: var(--blue); font-weight: 700; text-align: right; margin-left: auto; max-width: 85%; }
        .ai-line { color: #d1d5db; text-align: left; max-width: 85%; }

        /* --- CONTROLS --- */
        .control-system { width: 100%; max-width: 420px; text-align: center; }
        
        select {
            background: rgba(255,255,255,0.05);
            color: #9ca3af; 
            border: 1px solid var(--glass-border);
            padding: 18px;
            border-radius: 20px;
            width: 100%;
            margin-bottom: 25px;
            font-size: 14px;
            cursor: pointer;
            appearance: none;
            transition: 0.3s;
        }
        
        select:hover { background: rgba(255,255,255,0.08); border-color: var(--blue); }

        .btn-prime {
            width: 100%;
            padding: 22px;
            border-radius: 24px;
            border: none;
            background: var(--accent-gradient);
            color: #000;
            font-weight: 800;
            font-family: 'Orbitron';
            cursor: pointer;
            letter-spacing: 4px;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-size: 15px;
            text-transform: uppercase;
        }

        .btn-prime:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 20px 40px rgba(76, 201, 240, 0.4);
            filter: brightness(1.1);
        }

        /* --- FOOTER --- */
        .footer-premium {
            margin-top: auto;
            padding: 60px 0;
            text-align: center;
            width: 100%;
        }

        .dev-card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            padding: 30px;
            border-radius: 30px;
            max-width: 500px;
            margin: 0 auto;
        }

        .dev-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--purple);
            margin-bottom: 5px;
            display: block;
            font-weight: 700;
        }

        .dev-card h3 { 
            font-family: 'Orbitron'; 
            font-size: 18px; 
            color: var(--blue); 
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .dev-card p {
            font-size: 13px; 
            color: #7d8191; 
            margin: 0;
        }

        .social-btn-fb {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 25px;
            padding: 12px 28px;
            background: #1877F2;
            color: white;
            text-decoration: none;
            border-radius: 100px;
            font-size: 13px;
            font-weight: 700;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(24, 119, 242, 0.2);
        }

        .social-btn-fb:hover { 
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 30px rgba(24, 119, 242, 0.4);
            filter: brightness(1.1);
        }

        .fb-icon {
            width: 18px;
            height: 18px;
            fill: white;
        }

        .hidden { display: none !important; }
    </style>
</head>

<body>

    <header class="brand-header">
        <h1><span class="brand-lag">LAG</span><span class="brand-mate">mate</span></h1>
        <div class="hero-subtitle">Revolutionizing Language Intelligence</div>
    </header>

    <div class="orb-wrapper">
        <div class="orb" id="orb"></div>
    </div>

    <div class="status-badge">
        <div class="dot" id="statusDot"></div>
        <div id="statusLabel" style="font-size: 11px; font-weight: 800; letter-spacing: 3px; color: #6b7280;">SYSTEM SECURED</div>
    </div>

    <div class="transcript-container">
        <div class="line ai-line" id="aiTxt">Greetings. I am LAGmate, your cognitive language assistant. Initiate the session to begin your professional immersion.</div>
        <div class="line user-line" id="userTxt"></div>
    </div>

    <div class="control-system" id="uiPanel">
        <!-- Install Interface বাটন সরিয়ে ফেলা হয়েছে -->
        <select id="micSelect"><option value="">Detecting Input Hardware...</option></select>
        <button class="btn-prime" id="startBtn">START IMMERSION</button>
    </div>

    <footer class="footer-premium">
        <div class="dev-card">
            <span class="dev-label">Developed by</span>
            <h3>Mohammad Miraz Ali</h3>
            <p>EEE, University of Dhaka • AI Architect</p>
            
            <a href="https://www.facebook.com/mohammad.miraz.ali.2025" target="_blank" class="social-btn-fb">
                <svg class="fb-icon" viewBox="0 0 24 24">
                    <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                </svg>
                Find me on Facebook
            </a>
        </div>
    </footer>

    <script>
        /**
         * GLOBAL CONFIG & STATE
         */
        const BACKEND_URL = 'https://lgmate.onrender.com/chat';
        const orb = document.getElementById('orb');
        const aiTxt = document.getElementById('aiTxt');
        const userTxt = document.getElementById('userTxt');
        const statusLabel = document.getElementById('statusLabel');
        const startBtn = document.getElementById('startBtn');
        const micSelect = document.getElementById('micSelect');
        const uiPanel = document.getElementById('uiPanel');

        let isBusy = false;
        let selectedMicId = null;

        /**
         * UI SYNC & ANIMATIONS
         */
        function updateState(state) {
            orb.className = "orb " + state;
            switch(state) {
                case "listening": statusLabel.innerText = "CAPTURING AUDIO"; break;
                case "thinking": statusLabel.innerText = "SYNTHESIZING"; break;
                case "speaking": statusLabel.innerText = "LAGmate RESPONDING"; break;
                default: statusLabel.innerText = "SYSTEM SECURED"; break;
            }
        }

        async function streamType(text, element) {
            element.innerText = "";
            const words = text.split(" ");
            for (let word of words) {
                element.innerText += word + " ";
                await new Promise(r => setTimeout(r, 40));
            }
        }

        /**
         * MICROPHONE & AUDIO LOGIC
         */
        async function setupDevices() {
            try {
                // Request initial permission
                await navigator.mediaDevices.getUserMedia({ audio: true });
                const devices = await navigator.mediaDevices.enumerateDevices();
                const audioInputs = devices.filter(d => d.kind === "audioinput");
                
                micSelect.innerHTML = audioInputs.map(m => 
                    `<option value="${m.deviceId}">${m.label || "Microphone " + m.deviceId.slice(0,5)}</option>`
                ).join("");
                
                if (audioInputs.length > 0) selectedMicId = audioInputs[0].deviceId;
            } catch (e) {
                micSelect.innerHTML = `<option value="">Microphone Access Denied</option>`;
            }
        }

        micSelect.onchange = (e) => {
            selectedMicId = e.target.value;
        };

        /**
         * VOICE RECOGNITION PIPELINE
         */
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const rec = new SpeechRecognition();
            rec.lang = 'en-US';
            rec.interimResults = true;
            rec.continuous = false; 

            let retryCount = 0;
            const MAX_RETRIES = 3;

            rec.onstart = () => {
                retryCount = 0;
                updateState("listening");
            };

            rec.onresult = e => {
                const transcript = Array.from(e.results).map(r => r[0].transcript).join('');
                userTxt.innerText = transcript;
                if (e.results[0].isFinal) {
                    rec.stop();
                    processTranscript(transcript);
                }
            };

            rec.onend = () => {
                if (!isBusy) {
                    try { rec.start(); } catch(e) {}
                }
            };

            rec.onerror = (event) => {
                console.warn("Speech Error:", event.error);
                if (event.error === 'no-speech') return;
                
                isBusy = true; 
                updateState("");
                
                if (retryCount < MAX_RETRIES) {
                    retryCount++;
                    setTimeout(() => {
                        isBusy = false;
                        try { rec.start(); } catch(e) {}
                    }, 1000);
                } else {
                    aiTxt.innerText = "Voice input error. Please check settings.";
                }
            };

            async function processTranscript(text) {
                if (!text.trim()) return;
                isBusy = true;
                updateState("thinking");

                try {
                    const res = await fetch(BACKEND_URL, {
                        method: 'POST',
                        headers: {'Content-Type':'application/json'},
                        body: JSON.stringify({ text })
                    });
                    const data = await res.json();
                    
                    if (data.audio) {
                        playResponse(data.audio, data.reply);
                    } else {
                        await streamType(data.reply, aiTxt);
                        resetToListening();
                    }
                } catch (err) {
                    aiTxt.innerText = "Network error. Please try again.";
                    resetToListening();
                }
            }

            function playResponse(base64Audio, replyText) {
                const audio = new Audio("data:audio/mpeg;base64," + base64Audio);
                updateState("speaking");
                
                audio.play().then(async () => {
                    await streamType(replyText, aiTxt);
                }).catch(err => {
                    aiTxt.innerText = "[Click Orb to Play]: " + replyText;
                    orb.onclick = () => {
                        audio.play();
                        orb.onclick = null;
                    };
                });

                audio.onended = () => {
                    resetToListening();
                };
            }

            function resetToListening() {
                isBusy = false;
                userTxt.innerText = "";
                updateState("listening");
                try { rec.start(); } catch(e) {}
            }

            startBtn.onclick = () => {
                uiPanel.classList.add('hidden');
                const silent = new Audio();
                silent.play().catch(()=>{});
                rec.start();
            };
        } else {
            startBtn.disabled = true;
            startBtn.innerText = "UNSUPPORTED BROWSER";
        }

        window.onload = setupDevices;
    </script>
</body>
</html>
